# Sources for the job alert bot.
#
# Adding a board = adding an entry here. No code is touched, unless the platform
# is one that doesn't have a template yet.
#
# How to classify a new board (look at the URL of its jobs page):
#   boards.greenhouse.io/<company>   -> type: greenhouse   (company)
#   jobs.lever.co/<company>          -> type: lever        (company)
#   jobs.ashbyhq.com/<company>       -> type: ashby        (company)
#   <tenant>.<dc>.myworkdayjobs.com  -> type: workday      (tenant, site, dc)
#   domain with /widgets (Phenom)    -> type: pg           (P&G template)
#   none of the above                -> type: html         (CSS selector)
#
# LinkedIn and Indeed do NOT go here: they block scraping on purpose. For those
# two, use their native email alerts + a Gmail rule.

filters:
  # Evaluated against "<title> <location>", lowercased, as regexes.
  # If a title matches EXCLUDE, it's discarded even if it matches INCLUDE.
  #
  # INCLUDE is an OR: one match is enough. Note that it mixes two different
  # ideas — seniority and domain — so the real rule is "junior OR technical",
  # not "junior AND technical". Narrowing seniority is entirely EXCLUDE's job.
  #
  # Words deliberately NOT here, because they were measured against a real day's
  # catalog and brought in noise rather than jobs:
  #   security   -> "Security Investigator" (investigations, not infosec)
  #   support    -> "Trilingual Customer Support Representative"
  #   associate  -> "Warehouse Associate"
  #   technician -> "Aqua Systems Technician"
  #   systems, product, platform -> too generic to mean anything
  include:
    # Seniority / entry level. These pass on their own, whatever the domain.
    - '\bjunior\b'
    - '\bjr\b'
    - '\bentry.?level\b'
    - '\bintern\b'
    - '\binternship\b'
    - '\btrainee\b'
    - '\bgraduate\b'
    - '\bapprentice\b'
    # Roles.
    - '\bengineer\b'
    - '\bdeveloper\b'
    - '\bdev\b'
    - '\bprogrammer\b'
    - '\banalyst\b'
    # In this market a "Consultant" at Mastercard-style advisory shops is doing
    # analyst work, so it belongs here. Weak on purpose, like `analyst`: it stays
    # out of `strong_include` so the category gate can still cut a Finance or
    # Accounting consultant. Note `\bconsulting\b` is deliberately absent — it
    # appears as a department suffix ("Advisors & Consulting Services") on every
    # posting of that org, whatever the actual role is.
    - '\bconsultant\b'
    - '\bscientist\b'
    - '\barchitect\b'
    - '\bsre\b'
    - '\bdevops\b'
    # QA / testing. `\bqa\b` does NOT match "Quality Assurance" spelled out,
    # which is why both forms are here. Bare `quality` is deliberately absent:
    # it drags in "Supplier Quality Engineer" and "Quality Inspector" from
    # manufacturing, and `engineer` in `strong_include` would rescue them past
    # the category gate. Same reason `\bqc\b` is out — quality control is a
    # factory-floor term here.
    - '\btester\b'
    - '\btesting\b'
    - '\btest\b'
    - '\bqa\b'
    - 'quality assurance'
    - '\bsdet\b'
    - '\bverification\b'
    - '\bvalidation\b'
    - '\be2e\b'
    # Domains.
    - '\bsoftware\b'
    - '\bdata\b'
    - '\banalytics\b'
    - '\bdatabase\b'
    - '\bdba\b'
    - '\bback.?end\b'
    - '\bfront.?end\b'
    - '\bfull.?stack\b'
    - '\bcloud\b'
    - '\binfrastructure\b'
    - '\bautomation\b'
    - '\bmachine learning\b'
    - '\bml\b'
    # No closing \b on purpose: it has to catch "Cybersecurity" as one word too.
    - '\bcyber'
    # Technologies. Cheap insurance: they cost nothing when no title mentions
    # them, and they catch the posting that names the stack instead of the role.
    - '\bpython\b'
    - '\bjava(script)?\b'
    - '\bsql\b'
    - '\baws\b'
    - '\blinux\b'
    - '\bapi\b'
    # QA tooling. Zero false-positive risk: nothing outside testing puts these
    # in a job title.
    - '\bselenium\b'
    - '\bcypress\b'
    - '\bplaywright\b'
    - '\bappium\b'
    - '\bjmeter\b'
    - '\bpostman\b'
    - '\bjunit\b'
    - '\btestng\b'
    - '\bcucumber\b'
  exclude:
    - '\bsenior\b'
    - '\bstaff\b'
    - '\bprincipal\b'
    - '\blead\b'
    - '\bmanager\b'
    - '\bdirector\b'
    - '\bsr\.?\b'
    - '\bhead of\b'
    # `developer` is worth having, but on HPE it drags in five copies of
    # "Technical Courseware Developer" — writing training material, not code.
    # Delete this line if you'd rather see them.
    - '\bcourseware\b'
  #
  # Category gate. Five of the six sources carry the ATS's own `category`, which
  # is structured data and so beats guessing from the title. It is NOT a hard
  # block: companies file roles under the business unit they serve, so a real BI
  # Developer sits under "Finance & Audit". So a non-technical category only
  # raises the bar — the title then needs a word from `strong_include`, and a
  # weak one like `analyst` or `data` no longer suffices.
  #
  # Moody's carries no category (Radancy's listing doesn't include it), so it
  # skips this gate and keeps working purely on words.
  #
  # Set `nontech_categories: []` to turn the whole gate off.
  strong_include:
    - '\bengineer\b'
    - '\bdeveloper\b'
    - '\bdev\b'
    - '\bprogrammer\b'
    - '\barchitect\b'
    - '\bscientist\b'
    - '\bsre\b'
    - '\bdevops\b'
    - '\bqa\b'
    - 'quality assurance'
    - '\btester\b'
    # `testing` was in `include` but missing here, so a "Testing Specialist" in
    # a non-technical category got dropped while a "Tester" got rescued.
    - '\btesting\b'
    - '\btest\b'
    - '\bsdet\b'
    - '\bverification\b'
    - '\bselenium\b'
    - '\bcypress\b'
    - '\bappium\b'
    - '\bjmeter\b'
    - '\bautomation\b'
    - '\bcloud\b'
    - '\bcyber'
    - '\bdatabase\b'
    - '\bdba\b'
    - '\bmachine learning\b'
    - '\bback.?end\b'
    - '\bfront.?end\b'
    - '\bfull.?stack\b'
    # `software` is deliberately absent: "Software Contract Negotiator / Data
    # Analyst" is a Sourcing & Procurement role. Real software titles carry
    # `engineer`, `developer` or `architect` anyway.
  nontech_categories:
    - 'accounting'
    - 'finance'
    - 'sourcing'
    - 'procurement'
    - 'human resources'
    - 'talent'
    - 'administration'
    - 'workplace'
    - '\bsales\b'
    # Broader than 'customer service' on purpose: TeKnowledge files everything
    # under "Customer Support", and the pattern also covers Success/Experience.
    # A genuinely technical role here is still rescued by `strong_include`.
    - 'customer'
    - 'manufacturing'
    - 'supply chain'
    - 'business operations'
    - 'legal'
    - 'marketing'
  # Location hint. Leave it empty ([]) to skip filtering by location — useful
  # when the source already comes filtered to Costa Rica at the origin.
  location_hints:
    - 'remote'
    - 'remoto'
    - 'latam'
    - 'americas'
    - 'costa rica'
    - 'anywhere'
    - 'heredia'
    - 'san jose'
    - 'san josé'

sources:
  # ---- Verified live -------------------------------------------------------

  # Equifax — XML feed with the full catalog (1 request, no pagination).
  - type: equifax
    countries: ["Costa Rica"]

  # P&G — Phenom platform (POST to /widgets with an x-csrf-token).
  - type: pg
    countries: ["Costa Rica"]

  # Cisco — also Phenom, same /widgets endpoint, different domain.
  - type: cisco
    countries: ["Costa Rica"]

  # HPE — Phenom just like the two above (site on the en_us market).
  - type: hpe
    countries: ["Costa Rica"]

  # West Monroe — Greenhouse. The API has no location filter (the board's UI
  # filters in the browser), so the fetcher applies `countries` locally.
  - type: greenhouse
    company: westmonroe4
    name: "West Monroe"
    countries: ["Costa Rica"]

  # Gorilla Logic — BambooHR. The structured location fields come back null, so
  # the country is matched against the title text (see the fetcher's docstring).
  - type: gorillalogic
    countries: ["Costa Rica"]

  # BCG — Phenom, page17-ds. The site filters by country through `keywords`;
  # the preset uses the structured facet instead.
  - type: bcg
    countries: ["Costa Rica"]

  # Mastercard — Phenom, classic payload (pageId + all_fields), en_us market.
  - type: mastercard
    countries: ["Costa Rica"]

  # Roche — Phenom too, but the newer CareerConnect skin (clientName /
  # cultureName instead of refNum / lang, and no pageId).
  - type: roche
    countries: ["Costa Rica"]

  # Moody's — Radancy/TalentBrew (a GET that returns HTML inside a JSON).
  - type: moodys
    countries: ["Costa Rica"]

  # Citi — Radancy too, but this tenant serves the postings server-rendered and
  # returns nothing from the JSON endpoint; the fetcher falls back on its own.
  - type: radancy
    name: "Citi"
    site: "https://jobs.citi.com"
    org_id: "287"
    countries: ["Costa Rica"]

  # Workday (the company runs its own product). Config only — the `workday`
  # template already covered it. Note this tenant names the country facet
  # `Location_Country`, not `locationCountry` like P&G does.
  - type: workday
    tenant: workday
    dc: wd5
    site: "Workday"
    countries: ["Costa Rica"]
    name: "Workday"

  # IBM — its own unified search endpoint (Elasticsearch-shaped), no token.
  # The country name is validated against IBM's own index, so a typo raises
  # instead of quietly returning zero.
  - type: ibm
    countries: ["Costa Rica"]

  # TeKnowledge — Jibe front-end, iCIMS underneath (1 GET, no token).
  - type: teknowledge
    countries: ["Costa Rica"]

  # Amazon — its own ATS (amazon.jobs), 1 POST with no token and no cookies.
  # `countries` accepts the name or the ISO-2 code ("CR").
  #
  # It's the ONLY source that also filters by category at the origin: Amazon
  # publishes a lot that isn't engineering (sales, design, administrative
  # support: 65 of the 73 in Costa Rica). If `categories` is omitted, the
  # technical defaults are used (CATEGORIES_TECH in jobbot/fetchers/amazon.py).
  # `categories: []` brings ALL of them and lets the bot filter by title.
  # The names have to be exact; to see them:
  #     python -m jobbot.fetchers.amazon --categories
  - type: amazon
    countries: ["Costa Rica"]
    categories:
      - "Software Development"
      - "Operations, IT, & Support Engineering"
      - "Business Intelligence"
      - "Solutions Architect"

  # ---- Examples: uncomment and adjust --------------------------------------

  # Any other Phenom board (one with no preset in phenom.py). The values come
  # from the POST to /widgets in DevTools → Network:
  #   site       the board's domain
  #   page_id    payload's `pageId` field
  #   ref_num    payload's `refNum` field, if the site sends it
  #   id_prefix  prefix of the dedupe id; make it unique across sources
  # - type: phenom
  #   name: "Company W"
  #   site: "https://careers.companyw.com"
  #   warmup_path: "/en/jobs"
  #   page_id: "page123-prod"
  #   ref_num: "XXXGLOBAL"
  #   id_prefix: "companyw"
  #   countries: ["Costa Rica"]

  # Any other Jibe/iCIMS board (assets on app.jibecdn.com, and a
  # `domain=<tenant>.jibeapply.com` parameter in the request). `domain` is
  # optional — the endpoint answers without it — but worth copying anyway.
  # - type: jibe
  #   name: "Company U"
  #   site: "https://careers.companyu.com"
  #   domain: "companyu.jibeapply.com"
  #   id_prefix: "companyu"
  #   countries: ["Costa Rica"]

  # Any other Radancy/TalentBrew board (assets on tbcdn.talentbrew.com). You
  # need the domain and the request's `OrganizationIds`. The country has to be
  # in COUNTRY_GEO (jobbot/fetchers/radancy.py) — Radancy filters by geographic
  # node, not by name.
  # - type: radancy
  #   name: "Company V"
  #   site: "https://careers.companyv.com"
  #   org_id: "12345"
  #   countries: ["Costa Rica"]

  # Workday. tenant/dc/site come from the board's URL:
  #   https://pg.wd5.myworkdayjobs.com/1000  ->  tenant: pg, dc: wd5, site: "1000"
  # `countries` uses the name exactly as the site's filter shows it; the fetcher
  # translates it on its own into the facet ID Workday expects.
  #
  # CAREFUL: this entry is the SAME board as `type: pg` above (Phenom's "Apply"
  # redirects here). Enable one or the other, not both, or you'll receive every
  # posting twice — the IDs are different (`pg-` vs `wd-pg-`) and the dedupe
  # can't cross them.
  # - type: workday
  #   tenant: pg
  #   dc: wd5
  #   site: "1000"
  #   countries: ["Costa Rica"]
  #   name: "P&G"

  # - type: greenhouse
  #   company: name-in-the-url
  #   name: "Company X"

  # - type: lever
  #   company: name-in-the-url
  #   name: "Company Y"

  # - type: ashby
  #   company: name-in-the-url
  #   name: "Company Z"

  # Plain HTML: last resort when there's no API. The selector comes from
  # DevTools; it should point at the <a> of each posting.
  # - type: html
  #   name: "Generic board"
  #   url: "https://example.com/careers"
  #   item_selector: "a.job-link"
  #   base_url: "https://example.com"
