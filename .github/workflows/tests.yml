name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run obsolete. Here it does pay to cancel it,
# unlike in the alerts workflow: over there, cancelling midway could leave the
# seen-jobs database unsaved.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what runs the bot in production (see job-alerts.yml) and 3.14
        # is the development environment. Testing both avoids the annoying case
        # where something works on the local machine and breaks in the cron, or
        # the other way around.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      # No secrets on purpose: no test goes out to the network or talks to
      # Telegram. If one ever needs them, that's a sign it stopped being a unit
      # test and became an integration test.
      - run: pytest -q
