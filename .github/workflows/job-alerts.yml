name: Alertas de empleo

on:
  schedule:
    # Cada 30 minutos, pero en :07 y :37 y NO en :00/:30, que es donde programa
    # todo el mundo y donde la cola de GitHub es más profunda.
    #
    # Los cron de Actions son best-effort: bajo carga GitHub atrasa la corrida
    # y, si el atraso se come el turno siguiente, la **descarta** (no la encola
    # ni la recupera). Medido sobre las primeras 34 corridas con `*/30`: se
    # ejecutó el 29% de lo programado, mediana de 83 min entre corridas, mínimo
    # 59 min (nunca llegó a correr cada 30) y picos de casi 4 h. Correr en
    # minutos impares es la única palanca gratis que existe contra esto.
    #
    # Para vacantes de empleo el atraso da igual, y el dedupe evita duplicados
    # sin importar cuándo corra. Frecuencia y costo: ~1440 corridas/mes, que en
    # repo privado entrarían justo en los 2000 min/mes del plan Free; en repo
    # público (este) los minutos son gratis e ilimitados.
    - cron: "7,37 * * * *"
  workflow_dispatch:        # botón "Run workflow" para probar a mano

# Dos corridas en paralelo se pisarían la base de vistos y podrían notificar
# duplicados: que espere la anterior.
concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      # Persistencia de seen_jobs.db entre corridas.
      #
      # Sin esto el runner arranca limpio cada vez, la base sale vacía y el bot
      # cree que es la primera corrida: siembra en silencio y no notifica NADA.
      # Ojo con esto, que es contraintuitivo — la falla no es recibir todo
      # duplicado, es no recibir nunca más nada, y desde afuera se lee igual que
      # "no salieron vacantes nuevas".
      #
      # La key lleva el run_id (siempre distinto) para que cada corrida guarde
      # una entrada nueva — las caches de Actions son inmutables, sobrescribir
      # una key existente no funciona. `restore-keys` con el prefijo recupera
      # la más reciente. El `save` va aparte y con `always()` para que la base
      # se guarde aunque el bot termine en error.
      # ---------------------------------------------------------------
      - name: Restaurar base de vistos
        uses: actions/cache/restore@v6
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Revisar bolsas de empleo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Guardar base de vistos
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
