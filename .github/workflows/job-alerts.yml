name: Job alerts

on:
  schedule:
    # Every 30 minutes, but at :07 and :37 and NOT at :00/:30, which is where
    # everybody schedules and where GitHub's queue is deepest.
    #
    # Actions cron schedules are best-effort: under load GitHub delays the run
    # and, if the delay eats the next slot, it **discards** it (it doesn't queue
    # it or recover it). Measured over the first 34 runs with `*/30`: it ran 29%
    # of what was scheduled, a median of 83 min between runs, a minimum of 59 min
    # (it never actually ran every 30) and peaks of almost 4 h. Running on odd
    # minutes is the only free lever that exists against this.
    #
    # For job postings the delay doesn't matter, and the dedupe prevents
    # duplicates no matter when it runs. Frequency and cost: ~1440 runs/month,
    # which on a private repo would just about fit in the Free plan's 2000
    # min/month; on a public repo (this one) the minutes are free and unlimited.
    - cron: "7,37 * * * *"
  workflow_dispatch:        # "Run workflow" button for manual testing

# Two runs in parallel would step on the seen-jobs database and could notify
# duplicates: make it wait for the previous one.
concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      # Persistence of seen_jobs.db between runs.
      #
      # Without this the runner starts clean every time, the database comes up
      # empty and the bot believes it's the first run: it seeds silently and
      # notifies NOTHING. Watch out for this one, it's counterintuitive — the
      # failure isn't receiving everything duplicated, it's never receiving
      # anything again, and from the outside it reads exactly like "no new
      # postings came up".
      #
      # The key carries the run_id (always different) so that each run saves a
      # new entry — Actions caches are immutable, overwriting an existing key
      # doesn't work. `restore-keys` with the prefix recovers the most recent
      # one. The `save` is a separate step with `always()` so the database gets
      # saved even if the bot ends in an error.
      # ---------------------------------------------------------------
      - name: Restore seen-jobs database
        uses: actions/cache/restore@v6
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Check the job boards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Save seen-jobs database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
